name: Router 自动签到
on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时执行一次 (UTC 0,6,12,18 -> 北京时间 8,14,20,2)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkin:
    runs-on: windows-latest
    environment: production
    env:
      PYTHONIOENCODING: utf-8
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        version: "0.12.5"
        enable-cache: true

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: 安装依赖
      run: |
        echo "正在安装项目依赖..."
        uv sync --locked --no-dev
        echo "✅ 环境初始化完成"

    - name: 获取 Playwright 版本
      id: playwright-version
      run: |
        $version = uv run --no-sync python -c "import importlib.metadata; print(importlib.metadata.version('playwright'))"
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "Playwright version: $version"

    - name: 缓存 Playwright 浏览器
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: playwright-cache
      with:
        path: ~\AppData\Local\ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: 安装 Playwright 浏览器
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: |
        echo "缓存未命中，开始安装 Playwright 浏览器..."
        uv run --no-sync playwright install chromium --with-deps

    - name: 生成通知状态缓存键
      id: notify-state
      run: |
        $beijingDate = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), [System.TimeZoneInfo]::FindSystemTimeZoneById("China Standard Time")).ToString('yyyy-MM-dd')
        echo "date=$beijingDate" >> $env:GITHUB_OUTPUT

    - name: 恢复当天通知状态
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .venv/.checkin_notify_state.json
        key: notify-state-${{ steps.notify-state.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          notify-state-${{ steps.notify-state.outputs.date }}-

    - name: 执行签到
      env:
        ANYROUTER_ACCOUNTS: ${{ secrets.ANYROUTER_ACCOUNTS || '' }}
        AGENTROUTER_ACCOUNTS: ${{ secrets.AGENTROUTER_ACCOUNTS || '' }}
        NOTIFY_ONCE: ${{ vars.NOTIFY_ONCE || 'false' }}
        DINGDING_WEBHOOK: ${{ secrets['DINGDING_WEBHOOK'] || '' }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        XIZHI_KEY: ${{ secrets['XIZHI_KEY'] || '' }}
        SERVERPUSHKEY: ${{ secrets['SERVERPUSHKEY'] || '' }}
        FEISHU_WEBHOOK: ${{ secrets['FEISHU_WEBHOOK'] || '' }}
        WEIXIN_WEBHOOK: ${{ secrets['WEIXIN_WEBHOOK'] || '' }}
      run: |
        uv run --no-sync checkin.py

    - name: 保存当天通知状态
      if: always()
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .venv/.checkin_notify_state.json
        key: notify-state-${{ steps.notify-state.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: 执行结果
      if: always()
      run: |
        echo "签到任务执行完成"
        $beijingTime = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), [System.TimeZoneInfo]::FindSystemTimeZoneById("China Standard Time"))
        echo "北京时间: $($beijingTime.ToString('yyyy-MM-dd HH:mm:ss'))"
        echo ""
        echo "--- 定时执行说明 ---"
        echo "本任务每 6 小时执行一次 (UTC 0:00, 6:00, 12:00, 18:00)"
        echo "对应北京时间: 08:00, 14:00, 20:00, 02:00"
